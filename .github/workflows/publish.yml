# SPDX-License-Identifier: MIT
# Publish the signed DagNode DNF repository to https://rpm.dagnode.com/.
#
# This is the ONLY writer of the repository. Projects (tools-agent-tools-restricted and
# siblings) build and SIGN their own RPMs and publish them as GitHub Releases, then notify
# this repo via repository_dispatch (event: publish-rpm). This workflow rebuilds the whole
# repository STATELESSLY from those releases (the source of truth) -- main holds only the
# workflow, docs, and the projects.txt config, never RPMs -- regenerates metadata with
# createrepo_c, detached-signs repomd.xml, deploys via GitHub Pages, and finally re-fetches the
# live site to prove it serves that exact tree. A single concurrency group serializes concurrent
# project releases so two runs never race the deploy.
# See github-org-dag-node/RPM-REPO-HINTS.md for the architecture and setup.
name: Publish RPM repository

on:
  repository_dispatch:
    types: [publish-rpm]
  # Manual rebuild/backfill (also re-runs after editing projects.txt).
  workflow_dispatch:

# Minimal: the build is stateless (no commit -- main is config-only and branch-protected), so
# contents:read to check out the workflow + config; pages/id-token to deploy the built tree.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize every publish so concurrent project releases never race the Pages deploy.
# cancel-in-progress: false -- each release must be published, not dropped.
concurrency:
  group: rpm-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # The served trees, as <family>/<release>: a package lands in the tree its dist tag names
      # (.el9 -> el/9, .fc44 -> fedora/44) and only there, and every tree listed here gets signed
      # metadata even when it has no package. A dist tag with no tree here is dropped with a
      # warning, so a project cannot create a tree by releasing for a new distribution: adding
      # one is an edit to this list. Each family carries its own bootstrap alias, since the
      # dagnode-release package differs per family (its .repo names the family's baseurl).
      SERVED_TREES: el/9 el/10 fedora/44
      SERVED_ARCHES: x86_64 aarch64
    steps:
      # Always publish from main -- the released, PR-protected config (projects.txt, README, the
      # index/select scripts). Pinned so a later change of the repo default branch cannot silently
      # move the served source to an integration branch; the run itself is dispatch/manual, so the
      # checked-out ref, not the triggering ref, decides what gets served.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 -- workflow + projects.txt + README only, no RPMs in git
        with:
          ref: main

      - name: Install createrepo_c + rpm + gnupg
        run: sudo apt-get update && sudo apt-get install -y createrepo-c rpm gnupg

      # Import the signing key first and state, in public terms, which key this run holds, so a
      # wrong secret is one readable line at the top of the log rather than a warning per package
      # after every release has been downloaded. The primary fingerprint is compared with the key
      # the repository serves today: a signing-subkey rotation keeps the primary, so a different
      # primary is never a rotation, it is the wrong secret. The served public key is then exported
      # from this import, so what the repository serves can never drift from the key that signs.
      # The keyring is this step's alone: it lives on tmpfs (/dev/shm), a /dev/shm that is absent
      # or not tmpfs refuses, and the trap stops the agent the import started and wipes it. The
      # signing step imports the key again into a keyring of its own.
      - name: Import the signing key and state its identity
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GPG_SIGNING_KEY}" ] || { echo "::error::GPG_SIGNING_KEY is empty: the github-pages environment holds no secret of that name. Set the signing-subkey export: gh secret set GPG_SIGNING_KEY --env github-pages -R ${GITHUB_REPOSITORY} < signing-subkey.asc"; exit 1; }
          [[ -d /dev/shm && "$(stat -f -c %T /dev/shm 2>/dev/null)" == tmpfs ]] \
            || { echo "::error::/dev/shm is absent or not tmpfs"; exit 1; }
          GNUPGHOME="$(mktemp -d -p /dev/shm)" || { echo "::error::no directory could be created under /dev/shm"; exit 1; }
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent 2>/dev/null; rm -rf "${GNUPGHOME}"' EXIT
          printf '%s\n' "${GPG_SIGNING_KEY}" | gpg --batch --quiet --import \
            || { echo "::error::GPG_SIGNING_KEY did not import: the value is not an ASCII-armored key block. Export the signing subkey with gpg --armor --export-secret-subkeys '<subkey-fpr>!' and set it again"; exit 1; }
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          [ -n "${fpr}" ] || { echo "::error::GPG_SIGNING_KEY carries no secret key: the value is a public key, or an export without the secret part. Export the signing subkey with gpg --armor --export-secret-subkeys '<subkey-fpr>!' and set it again"; exit 1; }
          # Public identity only: fingerprints and key ids are what the served key file carries.
          echo "imported key:"
          gpg --batch --with-colons --list-keys "${fpr}" \
            | awk -F: '$1=="pub"{printf "  primary  "} $1=="sub"{printf "  subkey   "} $1=="fpr"{print $10} $1=="uid"{print "  uid      " $10}'
          # One check against the key the repository serves. Unreachable or absent (first publish)
          # is reported and not fatal; the per-package verification below still fails closed.
          if curl -fsSL --retry 3 -o served-key.asc "https://rpm.dagnode.com/RPM-GPG-KEY-dag-node"; then
            served="$(gpg --batch --with-colons --show-keys served-key.asc 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')"
            if [ -n "${served}" ] && [ "${served}" != "${fpr}" ]; then
              echo "::error::the imported key (primary ${fpr}) is not the key the repository serves (primary ${served}). The github-pages environment's GPG_SIGNING_KEY is a different key from the one that signed the published packages; set the export of the serving key's signing subkey"
              exit 1
            fi
            echo "primary fingerprint matches the served key"
          else
            echo "no served key to compare against (first publish, or rpm.dagnode.com unreachable)"
          fi
          # Export the served public key WITH a human-readable header: a constant preamble plus the
          # primary key's identity block (short-id line, fingerprint, uid) derived from the key
          # itself, so the header can never drift from the key it precedes. gpg/rpm skip any text
          # before the -----BEGIN PGP PUBLIC KEY BLOCK----- marker, so dnf/rpm import is unaffected
          # -- this is the same layout the distro RPM-GPG-KEY files carry.
          pub="$(gpg --batch --with-colons --list-keys "${fpr}")"
          keylen="$(awk -F: '$1=="pub"{print $3; exit}' <<<"${pub}")"
          algo="$(awk -F: '$1=="pub"{print $4; exit}' <<<"${pub}")"
          keyid="$(awk -F: '$1=="pub"{print $5; exit}' <<<"${pub}")"
          created="$(awk -F: '$1=="pub"{print $6; exit}' <<<"${pub}")"
          fprhex="$(awk -F: '$1=="fpr"{print $10; exit}' <<<"${pub}")"
          uid="$(awk -F: '$1=="uid"{print $10; exit}' <<<"${pub}")"
          case "${algo}" in 1) algoc=R ;; 17) algoc=D ;; 18|22) algoc=E ;; *) algoc="?" ;; esac
          if [[ "${created}" =~ ^[0-9]+$ ]]; then created_date="$(date -u -d "@${created}" +%Y-%m-%d)"; else created_date="${created%%T*}"; fi
          grp() { sed -E 's/(.{4})/\1 /g; s/ $//' <<<"$1"; }                # 4-hex groups
          fpr_spaced="$(grp "${fprhex:0:20}")  $(grp "${fprhex:20:20}")"    # double space mid-fingerprint, as gpg prints it
          {
            printf '%s\n' \
              'DagNode RPM GPG Public Key' \
              '' \
              'This public key is used to verify RPM packages and repository' \
              'metadata signed by DagNode. Packages and the repomd.xml index' \
              'are signed with the signing subkey this key carries; the' \
              'primary key is certify-only.' \
              '' \
              'Import this key to enable gpgcheck and repo_gpgcheck for the' \
              'DagNode repositories.' \
              '' \
              'Key valid for 10 years. Questions: tools@dagnode.com' \
              ''
            printf 'pub   %s%s/%s %s\n' "${keylen}" "${algoc}" "${keyid: -8}" "${created_date}"
            printf '      Key fingerprint = %s\n' "${fpr_spaced}"
            printf 'uid                  %s\n\n' "${uid}"
            gpg --batch --armor --export "${fpr}"
          } > RPM-GPG-KEY-dag-node

      # Rebuild from the projects' releases (the source of truth): for each project in
      # projects.txt, select which release tags to keep (bounded history, see
      # select-releases.py) and download only those releases' signed *.rpm. Stateless and
      # idempotent -- any dispatch just means "something changed, rebuild the whole repo".
      # Public releases, so this repo's own GITHUB_TOKEN reads them; no cross-repo token needed.
      - name: Aggregate signed RPMs from project releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # History floor: serve the latest patch of every MAJOR.MINOR series at or above
          # MIN_VERSION, per project. This drops the pre-integrations-split 0.6.x line while
          # keeping every current minor (dagnode-release at v1.0.0+ sits above the floor). Raise
          # the floor to evict more old minors; their releases stay on GitHub, just not served here.
          MIN_VERSION: "0.11.1"
        run: |
          set -euo pipefail
          mkdir -p incoming
          # Read the project list without a `... | while read` pipeline, whose subshell would
          # swallow a `set -e` abort from the downloads below.
          mapfile -t projects < <(grep -vE '^\s*(#|$)' projects.txt)
          for proj in "${projects[@]}"; do
            echo "::group::${proj}"
            # List all tags (cheap, metadata only), then let select-releases.py pick the retained
            # set; only those are downloaded. A failed listing must abort rather than rebuild the
            # repo without this project's packages -- the assignment propagates gh's exit status
            # under `set -e`. --limit is generous headroom over the retained count; gh returns
            # newest-first, so the recent minors we keep are always covered.
            all_tags="$(gh release list --repo "${proj}" --limit 1000 --json tagName -q '.[].tagName')"
            kept_tags="$(printf '%s\n' "${all_tags}" | python3 .github/scripts/select-releases.py "${MIN_VERSION}")"
            for tag in ${kept_tags}; do
              # Only releases that actually carry a *.rpm asset are downloaded. A release with no
              # rpm asset is normal (e.g. a docs-only tag) and skipped; a download that then FAILS
              # is a real error (network/rate-limit) and aborts the run rather than deploying a repo
              # that silently drops that release's already-published packages.
              n_rpm="$(gh release view "${tag}" --repo "${proj}" --json assets \
                        -q '[.assets[].name | select(endswith(".rpm"))] | length')"
              if [ "${n_rpm}" -gt 0 ]; then
                gh release download "${tag}" --repo "${proj}" --pattern '*.rpm' --dir "incoming/${tag}"
              else
                echo "  (${tag}: no RPM assets)"
              fi
            done
            echo "::endgroup::"
          done
          echo "aggregated:"; find incoming -name '*.rpm' | sort

      # Verify every aggregated RPM against the exported key. Publish only packages actually signed
      # by it: any that fail verification are dropped from incoming/ so the build step below never
      # copies them. The fail-closed guarantee holds -- an unsigned package never reaches _site --
      # without one stale asset blocking the whole rebuild. The outcome is one diagnosis, not a
      # line per package: the skipped names, and the key id that signed the first of them next
      # to the key ids this run imported, which is the whole root cause when they differ.
      - name: Verify packages against the imported key
        run: |
          set -euo pipefail
          rpmdb="$(mktemp -d)"
          rpmkeys --dbpath "${rpmdb}" --import RPM-GPG-KEY-dag-node
          shopt -s nullglob
          published=0; skipped=()
          for r in $(find incoming -name '*.rpm'); do
            # Require a cryptographic signature LINE that validates, not just a zero exit: `--checksig`
            # exits 0 and prints only "digests OK" for an UNSIGNED package, so trusting its summary
            # would publish unsigned packages. `-Kv` prints a "Signature ...: OK" line only when a
            # signature is present and verifies against the imported org key.
            if rpmkeys --dbpath "${rpmdb}" -Kv "${r}" 2>&1 | grep -Eqi 'signature.*:[[:space:]]*OK[[:space:]]*$'; then
              published=$((published+1))
            else
              skipped+=("${r}")
            fi
          done
          echo "signature check: ${published} published, ${#skipped[@]} skipped"
          if [ "${#skipped[@]}" -gt 0 ]; then
            # Who signed the first skipped package, against what this run imported. `-Kv` names the
            # signer's key id on its signature line (NOKEY when the key is not in the rpmdb).
            signer="$(rpmkeys --dbpath "${rpmdb}" -Kv "${skipped[0]}" 2>&1 | { grep -i signature || true; } | head -1 | sed 's/^ *//')"
            # The key ids are read off the exported public key; this step holds no secret keyring.
            imported="$(gpg --batch --with-colons --show-keys RPM-GPG-KEY-dag-node 2>/dev/null | awk -F: '$1=="fpr"{print substr($10, length($10)-15)}' | paste -sd' ')"
            echo "::warning::${#skipped[@]} package(s) are not signed by the imported key and are dropped from this publish. First: $(basename "${skipped[0]}"): ${signer:-no signature line}. Imported key ids: ${imported}"
            echo "::group::skipped packages"; for r in "${skipped[@]}"; do basename "${r}"; done | sort; echo "::endgroup::"
            for r in "${skipped[@]}"; do rm -f "${r}"; done
          fi
          # Zero packages with zero skips is the legitimate bootstrap state; every downloaded
          # package failing verification is a key/secret mismatch, and deploying would replace
          # the served repository with an empty one.
          if [ "${#skipped[@]}" -gt 0 ] && [ "${published}" -eq 0 ]; then
            echo "::error::every downloaded package failed signature verification: the imported key is not the key that signed them. Refusing to deploy an empty repository over the served one"
            exit 1
          fi

      # Assemble the served tree + metadata. Packages are noarch, so each is placed into every
      # supported $basearch tree -- a client's baseurl uses $basearch, so the noarch package
      # must resolve there. --database adds SQLite metadata some clients prefer; repomd.xml is
      # detached-signed for repo_gpgcheck=1.
      - name: Build signed repository into _site
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The org signing key is passphrase-protected; repomd.xml is detached-signed below with
          # the key imported here into this step's own tmpfs keyring, which the trap wipes, agent
          # first, on exit, success or failure, so the private key is gone before the Pages actions
          # below run. The passphrase stays in the env var and is streamed over stdin
          # (--passphrase-fd 0) at sign time -- never written to a file.
          [ -n "${GPG_SIGNING_PASSPHRASE}" ] || { echo "::error::GPG_SIGNING_PASSPHRASE secret not set"; exit 1; }
          [[ -d /dev/shm && "$(stat -f -c %T /dev/shm 2>/dev/null)" == tmpfs ]] \
            || { echo "::error::/dev/shm is absent or not tmpfs"; exit 1; }
          GNUPGHOME="$(mktemp -d -p /dev/shm)" || { echo "::error::no directory could be created under /dev/shm"; exit 1; }
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent 2>/dev/null; rm -rf "${GNUPGHOME}"' EXIT
          printf '%s\n' "${GPG_SIGNING_KEY}" | gpg --batch --quiet --import \
            || { echo "::error::GPG_SIGNING_KEY did not import in the signing step"; exit 1; }
          mkdir -p _site   # exist even with zero packages (initial state) so the copies + index below work
          # Route each package by its dist tag into one served tree: `.elN` is the el family and
          # `.fcN` is fedora, N the release. The tree must be in SERVED_TREES (an allowlist), so a
          # package for a release this repo does not serve is dropped with a warning rather than
          # creating an unlisted tree with no metadata step behind it.
          for r in $(find incoming -name '*.rpm'); do
            base="$(basename "${r}")"
            if [[ "${base}" =~ \.el([0-9]+)\.noarch\.rpm$ ]]; then
              tree="el/${BASH_REMATCH[1]}"
            elif [[ "${base}" =~ \.fc([0-9]+)\.noarch\.rpm$ ]]; then
              tree="fedora/${BASH_REMATCH[1]}"
            else
              echo "::warning::${base} has no elN/fcN dist tag -- skipping"; continue
            fi
            case " ${SERVED_TREES} " in
              *" ${tree} "*) ;;
              *) echo "::warning::${base} is built for ${tree}, which is not a served tree -- skipping"; continue ;;
            esac
            for arch in ${SERVED_ARCHES}; do
              mkdir -p "_site/${tree}/${arch}"
              cp -f "${r}" "_site/${tree}/${arch}/"
            done
          done
          # Generate + sign metadata for EVERY served tree, even one with zero packages. On the
          # initial (empty) state no package-copy above created these dirs, so without this a client
          # baseurl would 404 on a missing repodata/repomd.xml; createrepo_c on an empty dir emits
          # valid (empty) metadata, and repo_gpgcheck=1 clients still need the signed repomd.xml.
          for tree in ${SERVED_TREES}; do
            for arch in ${SERVED_ARCHES}; do
              d="_site/${tree}/${arch}"
              mkdir -p "${d}"
              createrepo_c --database "${d}"
              printf '%s' "${GPG_SIGNING_PASSPHRASE}" \
                | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                      --digest-algo SHA256 --detach-sign --armor "${d}/repodata/repomd.xml"
              # A zero exit alone is not proof the signature was produced; assert it validates.
              gpg --batch --verify "${d}/repodata/repomd.xml.asc" "${d}/repodata/repomd.xml"
            done
          done
          cp RPM-GPG-KEY-dag-node _site/
          # Serve the manual/config-manager .repo files (gpgkey=https:// form), one per family, at
          # stable URLs so `curl -o /etc/yum.repos.d/dagnode.repo` and Ansible get_url work without
          # hand-pasting. Committed files, so a missing copy is a real error -- no `|| true`.
          cp dagnode.repo dagnode-fedora.repo _site/
          # Stable bootstrap install URLs: copy each family's newest dagnode-release build to a
          # version-independent name, so `dnf install https://rpm.dagnode.com/<family>/dagnode-release-latest.noarch.rpm`
          # always fetches the current bootstrap package for that family. The package is built per
          # family (its .repo names the family's baseurl), so an alias is chosen within one family;
          # `sort -V` picks the highest version, then the highest release. The site-root alias is the
          # el family's, the documented EL install URL every existing host and page names.
          for family in $(printf '%s\n' ${SERVED_TREES} | cut -d/ -f1 | sort -u); do
            latest_rel="$(find "_site/${family}" -name 'dagnode-release-*.noarch.rpm' -printf '%f\n' | sort -V | tail -1)"
            if [ -n "${latest_rel}" ]; then
              cp -f "$(find "_site/${family}" -name "${latest_rel}" | head -1)" "_site/${family}/dagnode-release-latest.noarch.rpm"
              echo "bootstrap latest alias ${family}/ -> ${latest_rel}"
            else
              echo "::warning::no dagnode-release RPM served for ${family} -- ${family}/dagnode-release-latest.noarch.rpm not published"
            fi
          done
          if [ -f _site/el/dagnode-release-latest.noarch.rpm ]; then
            cp -f _site/el/dagnode-release-latest.noarch.rpm _site/dagnode-release-latest.noarch.rpm
          fi
          cp README.md _site/ 2>/dev/null || true
          # Keep the rpm.dagnode.com custom domain bound under GitHub-Actions Pages deploys.
          echo 'rpm.dagnode.com' > _site/CNAME
          echo "served tree:"; find _site -maxdepth 4 -type d | sort

      # Utilitarian autoindex so the served tree is browsable in a browser (Pages has no directory
      # listing). dnf only requests explicit file paths, so per-directory index.html is inert to
      # clients. Regenerated from the assembled _site each run (never drifts); the empty initial
      # state still renders -- the root page shows the key + install snippet.
      - name: Generate browsable index pages
        run: python3 .github/scripts/genindex.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # Post-deploy monitoring plane: every other gate in this workflow runs on the build side,
      # so this is what observes the result -- it re-fetches the deployed site and proves it serves
      # exactly the tree just built, retrying while the CDN propagates. It verifies with the public
      # key only and cannot remediate: a failure raises the run, and the remedy is another rebuild.
      # Timing, trust model and failure semantics are in the script header.
      - name: Verify the deployed site
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: bash .github/scripts/verify-deploy.sh "${SITE_URL}" _site
